services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      sky-calendar-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4010
      DATABASE_URL: postgresql://sky_calendar:${POSTGRES_PASSWORD}@sky-calendar-postgres:5432/sky_calendar
      PLATFORM_MINTER_PUBLIC_KEYS: ${PLATFORM_MINTER_PUBLIC_KEYS}
      PLATFORM_TOKEN_AUDIENCE: sky-calendar
      CORS_ORIGIN: https://app.skynet-initiative.com
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN}
    expose:
      - "4010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4010/api/v1/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      coolify:
        aliases:
          - sky-calendar-backend
      internal:

  sky-calendar-postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sky_calendar
      POSTGRES_USER: sky_calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sky_calendar -d sky_calendar"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

volumes:
  postgres-data:

networks:
  coolify:
    external: true
  internal:
