name: sky-calendar

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sky_calendar
      POSTGRES_USER: sky_calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sky_calendar -d sky_calendar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
